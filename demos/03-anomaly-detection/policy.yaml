apiVersion: nullfield.io/v1alpha1
kind: NullfieldPolicy
metadata:
  name: demo-03-anomaly
spec:
  identity:
    enabled: true
    providers:
      - name: test-idp
        issuer: "nullfield-test"
        jwksUri: "http://jwks:8888/jwks.json"
        audiences: ["nullfield"]
        clockSkew: "30s"

  # Both are opt-in and independent. detectReplay in particular changes the
  # contract with callers -- see the README -- so it is not on by default.
  integrity:
    enabled: true
    bindToSession: true
    detectReplay: true

  anomaly:
    enabled: true
    velocity:
      threshold: 8
      alertAction: DENY

  rules:
    - id: allow-read-only
      action: ALLOW
      mcpMethod: tools/call
      toolNames:
        - cost.check_usage
        - audit.list_actions
      requireIdentity: true

    - id: default-deny
      action: DENY
      mcpMethod: tools/call
      toolNames: ["*"]
      reason: "not granted by policy"

  # Well above the velocity threshold, so the breaker cannot be what refuses a
  # burst. Otherwise the velocity assertion would pass for the wrong reason.
  circuitBreaker:
    maxToolCallsPerSession: 100
    maxSessionDuration: 300s

  audit:
    logLevel: FULL
