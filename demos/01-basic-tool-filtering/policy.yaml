# The point of this policy is the shape, not the tool names. Two tiers of
# ALLOW, an explicit high-risk DENY, and a trailing default-deny so an
# unmatched tool is refused rather than waved through.
#
# The circuitBreaker block is set to 5 while compose.override.yaml sets
# NULLFIELD_CIRCUIT_MAX_CALLS to 50, so tripping on the sixth call proves the
# policy won. The policy used to be ignored entirely here.
apiVersion: nullfield.io/v1alpha1
kind: NullfieldPolicy
metadata:
  name: demo-01-basic
spec:
  rules:
    - id: tier-1-read-only
      action: ALLOW
      mcpMethod: tools/call
      toolNames:
        - cost.check_usage
        - audit.list_actions

    - id: tier-2-writes
      action: ALLOW
      mcpMethod: tools/call
      toolNames:
        - ticket.create

    # Registered, described, and refused. Naming it explicitly rather than
    # leaving it to the default-deny means the audit trail says which rule
    # made the call, which is the difference between a policy you can review
    # and one you can only observe.
    - id: tier-3-high-risk
      action: DENY
      mcpMethod: tools/call
      toolNames:
        - secrets.read_config
      reason: "high-risk tool, tier 3"

    - id: default-deny
      action: DENY
      mcpMethod: tools/call
      toolNames: ["*"]
      reason: "not granted by policy"

  circuitBreaker:
    maxToolCallsPerSession: 5
    maxSessionDuration: 300s
    # Parsed and still unread. Nothing in the codebase acts on onTrip, so this
    # is not a second behaviour, it is a label. test.sh says so.
    onTrip: DENY
