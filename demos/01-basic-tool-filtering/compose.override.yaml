services:
  nullfield:
    volumes:
      - ./demos/01-basic-tool-filtering/tools.yaml:/etc/nullfield/tools.yaml:ro
      - ./demos/01-basic-tool-filtering/policy.yaml:/etc/nullfield/policy.yaml:ro
    environment:
      # Deliberately loose. The policy asks for 5, so tripping on the sixth
      # call is what proves the policy takes precedence over the environment.
      NULLFIELD_CIRCUIT_MAX_CALLS: "50"
