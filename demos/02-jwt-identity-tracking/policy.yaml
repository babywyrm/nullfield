apiVersion: nullfield.io/v1alpha1
kind: NullfieldPolicy
metadata:
  name: demo-02-identity
spec:
  identity:
    enabled: true
    providers:
      # `jwks` is the compose service; the generated document is served from
      # the same directory the token generator wrote it to.
      - name: test-idp
        issuer: "nullfield-test"
        jwksUri: "http://jwks:8888/jwks.json"
        audiences: ["nullfield"]
        clockSkew: "30s"

    validation:
      requireSignature: true
      allowedAlgorithms: [RS256]
      requireExpiry: true
      requireAudience: true

  rules:
    # A human in mcp-writers gets everything, including the destructive tool.
    - id: human-writers-all
      action: ALLOW
      mcpMethod: tools/call
      toolNames: ["*"]
      requireIdentity: true
      when:
        identity: human
        claims:
          groups: { contains: "mcp-writers" }

    # An agent gets the read-only subset. Same registry, same upstream, less
    # authority -- which is the point of attaching identity to a call at all.
    - id: agent-read-only
      action: ALLOW
      mcpMethod: tools/call
      toolNames:
        - cost.check_usage
        - audit.list_actions
      requireIdentity: true
      when:
        identity: agent

    - id: autonomous-denied
      action: DENY
      mcpMethod: tools/call
      toolNames: ["*"]
      when:
        identity: autonomous
      reason: "autonomous callers are not permitted"

    - id: default-deny
      action: DENY
      mcpMethod: tools/call
      toolNames: ["*"]
      reason: "no matching rule"

  circuitBreaker:
    maxToolCallsPerSession: 50
    maxSessionDuration: 300s

  audit:
    logLevel: FULL
