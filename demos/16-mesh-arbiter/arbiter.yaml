# nullfield as the waypoint's external authorization service.
#
# Unlike proxy mode, nothing here sits in the request path. The waypoint calls
# this service and acts on the answer, which is why the same binary can run in
# no-op, observe, or enforce without the deployment changing shape.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nullfield-extauthz
  namespace: nullfield-mesh-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nullfield-extauthz-config
  namespace: nullfield-mesh-demo
data:
  NULLFIELD_EXTAUTHZ_LISTEN_ADDR: ":9191"
  # Flipped to "enforce" by test.sh once the observe assertions have passed.
  NULLFIELD_EXTAUTHZ_MODE: "observe"
  NULLFIELD_POLICY_PATH: "/etc/nullfield/policy.yaml"
  NULLFIELD_REGISTRY_PATH: "/etc/nullfield/tools.yaml"
  NULLFIELD_AUDIT_LOG_LEVEL: "FULL"
  NULLFIELD_EXTAUTHZ_LOG_PEER: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nullfield-extauthz-policy
  namespace: nullfield-mesh-demo
data:
  policy.yaml: |
    apiVersion: nullfield.io/v1alpha1
    kind: NullfieldPolicy
    metadata:
      name: mesh-demo
    spec:
      rules:
        - action: ALLOW
          mcpMethod: tools/call
          toolNames: [echo]
          maxCallsPerMinute: 60
        - action: DENY
          mcpMethod: tools/call
          toolNames: ["*"]
      audit:
        logLevel: FULL

  tools.yaml: |
    apiVersion: nullfield.io/v1alpha1
    kind: ToolRegistry
    metadata:
      name: mesh-demo-tools
    tools:
      - name: echo
        description: Echoes back the input
      - name: dangerous_tool
        description: Registered, and denied by policy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nullfield-extauthz
  namespace: nullfield-mesh-demo
  labels:
    app: nullfield-extauthz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nullfield-extauthz
  template:
    metadata:
      labels:
        app: nullfield-extauthz
    spec:
      serviceAccountName: nullfield-extauthz
      containers:
        - name: extauthz
          image: ghcr.io/babywyrm/nullfield-extauthz:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9191
          envFrom:
            - configMapRef:
                name: nullfield-extauthz-config
          volumeMounts:
            - name: policy
              mountPath: /etc/nullfield
              readOnly: true
          readinessProbe:
            grpc:
              port: 9191
            initialDelaySeconds: 2
            periodSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # Numeric, because the distroless base declares its user by name and
            # kubelet cannot verify a name against runAsNonRoot. Omitting it
            # fails at container creation, not at admission, so the deployment
            # is accepted and then never starts.
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: policy
          configMap:
            name: nullfield-extauthz-policy
---
apiVersion: v1
kind: Service
metadata:
  name: nullfield-extauthz
  namespace: nullfield-mesh-demo
spec:
  selector:
    app: nullfield-extauthz
  ports:
    - name: grpc
      port: 9191
      targetPort: grpc
      appProtocol: grpc
---
# targetRefs, not a selector. A CUSTOM policy without it binds to ztunnel, which
# is L4 only and cannot run an HTTP filter, so the provider is never consulted
# and nothing reports that it was skipped.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: nullfield-ext-authz
  namespace: nullfield-mesh-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mesh-demo-waypoint
  action: CUSTOM
  provider:
    name: nullfield-demo-ext-authz
  rules:
    - to:
        - operation:
            methods: ["POST"]
---
# Without this filter the check arrives anonymous. See
# deploy/manifests/peer-principal-envoyfilter.yaml for the full reasoning; the
# short version is that a waypoint terminates HBONE upstream of the listener
# running ext_authz, so there is no peer certificate to read there and Istio
# publishes the identity into filter state instead.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: nullfield-peer-principal
  namespace: nullfield-mesh-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mesh-demo-waypoint
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_authz
      patch:
        operation: INSERT_BEFORE
        value:
          name: nullfield.peer_principal
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                local HEADER = "x-nullfield-peer-principal"

                function envoy_on_request(handle)
                  local ok, err = pcall(function()
                    -- Strip any inbound value first, or a workload could assert
                    -- its own identity by simply sending the header.
                    handle:headers():remove(HEADER)

                    local principal = nil

                    local fs = handle:streamInfo():filterState()
                    if fs ~= nil then
                      local v = fs:get("io.istio.peer_principal")
                      if v ~= nil and v ~= "" then
                        principal = v
                      end
                    end

                    if principal == nil then
                      local ssl = handle:streamInfo():downstreamSslConnection()
                      if ssl ~= nil then
                        local sans = ssl:uriSanPeerCertificate()
                        if sans ~= nil and #sans > 0 then
                          principal = sans[1]
                        end
                      end
                    end

                    if principal ~= nil and principal ~= "" then
                      handle:headers():add(HEADER, principal)
                    end
                  end)

                  if not ok then
                    handle:logWarn("nullfield peer principal: " .. tostring(err))
                  end
                end
