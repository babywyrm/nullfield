# The workload side of the mesh demo: an MCP server behind a waypoint, and a
# client inside the mesh to call it.
#
# This namespace deliberately runs no other authorization provider. Sharing one
# with an enforcing provider makes the central claim untestable: every request
# returns 403 regardless of what nullfield decided, so "observe mode does not
# block" cannot be distinguished from "observe mode blocks and something else
# got there first".
apiVersion: v1
kind: Namespace
metadata:
  name: nullfield-mesh-demo
  labels:
    istio.io/dataplane-mode: ambient
    istio.io/use-waypoint: mesh-demo-waypoint
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mesh-demo-waypoint
  namespace: nullfield-mesh-demo
  labels:
    istio.io/waypoint-for: all
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-echo
  namespace: nullfield-mesh-demo
  labels:
    app: mcp-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-echo
  template:
    metadata:
      labels:
        app: mcp-echo
    spec:
      containers:
        - name: echo
          image: ghcr.io/babywyrm/nullfield-echo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-echo
  namespace: nullfield-mesh-demo
spec:
  selector:
    app: mcp-echo
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
---
# A client with its own service account, so the attested identity in the audit
# trail is a specific workload rather than the namespace default. That is the
# difference between "something in this namespace called the tool" and an answer
# worth acting on.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-demo-client
  namespace: nullfield-mesh-demo
---
apiVersion: v1
kind: Pod
metadata:
  name: mesh-demo-client
  namespace: nullfield-mesh-demo
  labels:
    app: mesh-demo-client
spec:
  serviceAccountName: mesh-demo-client
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["sleep", "infinity"]
