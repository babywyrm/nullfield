# Replaces demo 16's policy in the same namespace, lets the arbiter record
# Events there, and runs a webhook receiver that verifies what it is sent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nullfield-extauthz-policy
  namespace: nullfield-mesh-demo
data:
  policy.yaml: |
    apiVersion: nullfield.io/v1alpha1
    kind: NullfieldPolicy
    metadata:
      name: signals-demo
    spec:
      runToken:
        jwksUri: http://run-controller/.well-known/jwks.json
        audience: cluster.local
        maxLifetime: 15m
      # Each run gets two calls. The third trips that run's breaker.
      circuitBreaker:
        maxToolCallsPerSession: 2
      rules:
        - action: ALLOW
          mcpMethod: tools/call
          toolNames: [echo]
        - action: DENY
          mcpMethod: tools/call
          toolNames: ["*"]
      audit:
        logLevel: FULL

  tools.yaml: |
    apiVersion: nullfield.io/v1alpha1
    kind: ToolRegistry
    metadata:
      name: signals-demo-tools
    tools:
      - name: echo
        description: Echoes back the input
---
# Events land in the namespace of the workload they are about. Here that is
# this namespace; across a cluster, bind a ClusterRole instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nullfield-extauthz-signals
  namespace: nullfield-mesh-demo
rules:
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nullfield-extauthz-signals
  namespace: nullfield-mesh-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nullfield-extauthz-signals
subjects:
  - kind: ServiceAccount
    name: nullfield-extauthz
    namespace: nullfield-mesh-demo
---
# The receiver's script, demos/19-signals/receiver.py, is loaded into the
# signal-receiver ConfigMap by test.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-receiver
  namespace: nullfield-mesh-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signal-receiver
  template:
    metadata:
      labels:
        app: signal-receiver
    spec:
      containers:
        - name: receiver
          image: python:3.13-alpine
          command: ["python", "-u", "/app/receiver.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: secret, mountPath: /etc/signal, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: app
          configMap: {name: signal-receiver}
        - name: secret
          secret: {secretName: signal-webhook}
---
# Off the waypoint: otherwise the arbiter would be asked to authorize its own
# signal, and refuse it for carrying no run token.
apiVersion: v1
kind: Service
metadata:
  name: signal-receiver
  namespace: nullfield-mesh-demo
  labels:
    istio.io/use-waypoint: none
spec:
  selector:
    app: signal-receiver
  ports:
    - port: 80
      targetPort: 8080
