# nullfield as an Envoy external authorization decision service.
#
# This deploys beside an existing ext_authz provider rather than replacing it, so
# both decide on identical traffic and can be compared before anything is cut
# over. Defaults to observe mode: it records the action it would have taken and
# returns OK regardless.
#
# The namespace below assumes the mesh testbed. Adjust it, the extensionProvider
# service FQDN, and the AuthorizationPolicy namespace together — a provider
# pointing at a service that does not exist fails every check, and how that
# failure lands depends on the mesh's failure-mode setting rather than on
# anything nullfield decides.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nullfield-extauthz
  namespace: zerotrust
  labels:
    app.kubernetes.io/name: nullfield-extauthz
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nullfield-extauthz-config
  namespace: zerotrust
data:
  NULLFIELD_EXTAUTHZ_LISTEN_ADDR: ":9191"
  # no-op | observe | enforce. Anything unrecognised falls back to observe.
  NULLFIELD_EXTAUTHZ_MODE: "observe"
  NULLFIELD_POLICY_PATH: "/etc/nullfield/policy.yaml"
  NULLFIELD_REGISTRY_PATH: "/etc/nullfield/tools.yaml"
  NULLFIELD_AUDIT_LOG_LEVEL: "FULL"
  # Logs the source attributes and header names of every check. Turn on when
  # assurance reads NONE and you need to know whether a principal arrived at
  # all, arrived unparseable, or the caller is genuinely outside the mesh.
  NULLFIELD_EXTAUTHZ_LOG_PEER: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nullfield-extauthz-policy
  namespace: zerotrust
data:
  policy.yaml: |
    apiVersion: nullfield.io/v1alpha1
    kind: NullfieldPolicy
    metadata:
      name: extauthz-observe
      labels:
        nullfield.io/transport: "A"
    spec:
      rules:
        - action: ALLOW
          mcpMethod: tools/call
          toolNames: [echo, jira_get_issue]
          maxCallsPerMinute: 30
        # Default deny. In observe mode this produces a DENY counterfactual
        # rather than a refusal, which is what makes the shadow rollout
        # informative: every call records what enforcement would have done.
        - action: DENY
          mcpMethod: tools/call
          toolNames: ["*"]
      audit:
        logLevel: FULL
  tools.yaml: |
    apiVersion: nullfield.io/v1alpha1
    kind: ToolRegistry
    metadata:
      name: extauthz-tools
    tools:
      - name: echo
        description: Echoes back the input
      - name: jira_get_issue
        description: Read a Jira issue
        maxCallsPerMinute: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nullfield-extauthz
  namespace: zerotrust
  labels:
    app.kubernetes.io/name: nullfield-extauthz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nullfield-extauthz
  template:
    metadata:
      labels:
        app: nullfield-extauthz
    spec:
      serviceAccountName: nullfield-extauthz
      containers:
        - name: extauthz
          image: ghcr.io/babywyrm/nullfield-extauthz:latest
          # The image is side-loaded into containerd on the lab clusters, since
          # it is not anonymously pullable. Always would fail on every restart.
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9191
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nullfield-extauthz-config
          volumeMounts:
            - name: policy
              mountPath: /etc/nullfield
              readOnly: true
          # A grpc probe rather than tcpSocket: a listening socket proves nothing
          # if the Authorization service failed to register on it.
          readinessProbe:
            grpc:
              port: 9191
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9191
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # Required by the restricted Pod Security Standard, which the mesh
            # namespaces enforce.
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: policy
          configMap:
            name: nullfield-extauthz-policy
---
apiVersion: v1
kind: Service
metadata:
  name: nullfield-extauthz
  namespace: zerotrust
  labels:
    app.kubernetes.io/name: nullfield-extauthz
spec:
  selector:
    app: nullfield-extauthz
  ports:
    - name: grpc
      port: 9191
      targetPort: grpc
      # Istio routes by port name prefix. Without grpc here the waypoint treats
      # the ext_authz stream as opaque TCP and the check never completes.
      appProtocol: grpc
---
# Point a waypoint at the provider. This selects nothing by itself; it becomes
# active only once an AuthorizationPolicy names it.
#
# allowPartialMessage MUST match the mode. This is not a preference, and getting
# it wrong fails in opposite directions:
#
#   observe/no-op -> true.  With false, Envoy rejects any request whose body
#                           exceeds maxRequestBytes with a 413 *before* calling
#                           the check. nullfield never sees it and cannot
#                           observe it, yet the traffic is broken — so a rollout
#                           declared read-only starts failing large requests.
#                           Measured, not theorised. With true, Envoy forwards
#                           what fit plus x-envoy-auth-partial-body, and
#                           nullfield records a body_truncated counterfactual
#                           without touching the response.
#
#   enforce       -> false. Envoy fails closed at the proxy, which is stronger
#                           than nullfield denying after the fact, and the
#                           in-process truncation guard remains as defence in
#                           depth for anyone who sets true here anyway.
#
# The reference OPA provider in this mesh runs true while enforcing, which is
# the live bypass: a decision gets rendered on the first 8k of a 20k body.
#
# Apply by editing the istio ConfigMap under data.mesh.extensionProviders — this
# block is the fragment to add, not a standalone resource. Keep any existing
# providers in place. Note that Istio drops a second CUSTOM provider unless
# istiod runs with PILOT_ENABLE_MULTIPLE_CUSTOM_AUTHZ_PROVIDERS=true; without it
# the incumbent decides alone and nothing says so.
#
#   - name: nullfield-ext-authz
#     envoyExtAuthzGrpc:
#       service: nullfield-extauthz.zerotrust.svc.cluster.local
#       port: 9191
#       includeRequestBodyInCheck:
#         maxRequestBytes: 8192
#         allowPartialMessage: true   # observe; set false when enforcing
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: nullfield-ext-authz
  namespace: zerotrust
spec:
  action: CUSTOM
  provider:
    name: nullfield-ext-authz
  # Bind to the waypoint, not the namespace. A CUSTOM action needs L7, and in
  # ambient mode an unbound policy attaches to ztunnel, which only does L4 — the
  # policy is accepted, reports healthy, and never fires. Name the waypoint that
  # actually fronts the workload.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: zerotrust-waypoint
  rules:
    - to:
        - operation:
            paths: ["/mcp"]
