# nullfield as an Envoy external authorization decision service.
#
# This deploys beside an existing ext_authz provider rather than replacing it, so
# both decide on identical traffic and can be compared before anything is cut
# over. Defaults to observe mode: it records the action it would have taken and
# returns OK regardless.
#
# The namespace below assumes the mesh testbed. Adjust it, the extensionProvider
# service FQDN, and the AuthorizationPolicy namespace together — a provider
# pointing at a service that does not exist fails every check, and how that
# failure lands depends on the mesh's failure-mode setting rather than on
# anything nullfield decides.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nullfield-extauthz
  namespace: zerotrust
  labels:
    app.kubernetes.io/name: nullfield-extauthz
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nullfield-extauthz-config
  namespace: zerotrust
data:
  NULLFIELD_EXTAUTHZ_LISTEN_ADDR: ":9191"
  # no-op | observe | enforce. Anything unrecognised falls back to observe.
  NULLFIELD_EXTAUTHZ_MODE: "observe"
  NULLFIELD_POLICY_PATH: "/etc/nullfield/policy.yaml"
  NULLFIELD_REGISTRY_PATH: "/etc/nullfield/tools.yaml"
  NULLFIELD_AUDIT_LOG_LEVEL: "FULL"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nullfield-extauthz
  namespace: zerotrust
  labels:
    app.kubernetes.io/name: nullfield-extauthz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nullfield-extauthz
  template:
    metadata:
      labels:
        app: nullfield-extauthz
    spec:
      serviceAccountName: nullfield-extauthz
      containers:
        - name: extauthz
          image: ghcr.io/babywyrm/nullfield-extauthz:latest
          # The image is side-loaded into containerd on the lab clusters, since
          # it is not anonymously pullable. Always would fail on every restart.
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 9191
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nullfield-extauthz-config
          volumeMounts:
            - name: policy
              mountPath: /etc/nullfield
              readOnly: true
          # A grpc probe rather than tcpSocket: a listening socket proves nothing
          # if the Authorization service failed to register on it.
          readinessProbe:
            grpc:
              port: 9191
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9191
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: policy
          configMap:
            name: nullfield-extauthz-policy
---
apiVersion: v1
kind: Service
metadata:
  name: nullfield-extauthz
  namespace: zerotrust
  labels:
    app.kubernetes.io/name: nullfield-extauthz
spec:
  selector:
    app: nullfield-extauthz
  ports:
    - name: grpc
      port: 9191
      targetPort: grpc
      # Istio routes by port name prefix. Without grpc here the waypoint treats
      # the ext_authz stream as opaque TCP and the check never completes.
      appProtocol: grpc
---
# Point a waypoint at the provider. This selects nothing by itself; it becomes
# active only once an AuthorizationPolicy names it.
#
# allowPartialMessage is false, deliberately unlike the reference OPA provider:
# a body the arbiter cannot fully read must fail closed rather than be authorized
# on whichever fraction fit inside maxRequestBytes.
#
# Apply by editing the istio ConfigMap under data.mesh.extensionProviders — this
# block is the fragment to add, not a standalone resource. Keep any existing
# providers in place.
#
#   - name: nullfield-ext-authz
#     envoyExtAuthzGrpc:
#       service: nullfield-extauthz.zerotrust.svc.cluster.local
#       port: 9191
#       includeRequestBodyInCheck:
#         maxRequestBytes: 8192
#         allowPartialMessage: false
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: nullfield-ext-authz
  namespace: zerotrust
spec:
  action: CUSTOM
  provider:
    name: nullfield-ext-authz
  rules:
    - to:
        - operation:
            paths: ["/mcp"]
